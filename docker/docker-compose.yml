version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: backend_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/high_throughput_db
      - JWT_SECRET=supersecretjwtkeyforhighthroughputbackend2026
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT_REQUESTS=1000
      - RATE_LIMIT_WINDOW_SECONDS=60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=high_throughput_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d high_throughput_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  locust:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: locust_load_tester
    command: locust -f locustfile.py --host=http://web:8000
    ports:
      - "8089:8089"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
